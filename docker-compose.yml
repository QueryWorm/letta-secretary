services:
  letta-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta
      POSTGRES_DB: letta
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  letta-server:
    build: ./letta-server
    image: letta-server:custom
    environment:
      LETTA_PG_URI: postgresql://letta:letta@letta-db:5432/letta
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: dummy
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY}
      LETTA_API_KEY: ${LETTA_API_KEY}
      TTS_BASE_URL: http://tts:8000
      TZ: Europe/Kyiv
    ports:
      - "8283:8283"
    depends_on:
      - letta-db
      - litellm
    volumes:
      - type: volume
        source: letta-code-data
        target: /root/.letta/channels
        volume:
          subpath: channels
    restart: unless-stopped
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    restart: unless-stopped
  letta-code-channels:
    build: ./letta-code-channels
    depends_on:
      - letta-server
      - litellm
    env_file:
      - .env
    environment:
      LETTA_BASE_URL: http://letta-server:8283
      ENV_NAME: secretary-whatsapp
      TZ: Europe/Kyiv
      OPENAI_API_KEY: dummy
      OPENAI_TRANSCRIPTION_BASE_URL: http://litellm:4000
      OPENAI_TRANSCRIPTION_MODEL: whisper
      LETTA_INHERITED_CHANNEL_CONTEXT: '{"channelToolScope":{"channels":[{"channelId":"whatsapp","accountId":"f3ebe44a-27b7-4e92-a83f-030458a194d8"},{"channelId":"telegram","accountId":"beff2b65-16ce-49eb-9c14-1295604daaaa"}]}}'
    volumes:
      - letta-code-data:/root/.letta
    command: ["server", "--channels", "whatsapp,telegram", "--debug"]
    restart: unless-stopped
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - 4000:4000
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command:
      - --config
      - /app/config.yaml
    env_file:
      - .env
    restart: unless-stopped
    environment:
      TZ: Europe/Kyiv
      LITELLM_LOG: INFO
  tts:
    build: ./tts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  rag-uploader:
    build: ./rag-uploader
    ports:
      - "8081:8081"
    environment:
      LETTA_BASE_URL: http://letta-server:8283
      LETTA_API_KEY: ${LETTA_API_KEY}
      ARCHIVE_ID: archive-68b3e817-5b14-4bf0-a524-0808b530eac2
      DEFAULT_CHUNK_SIZE: "2000"
    depends_on:
      - letta-server
    restart: unless-stopped
volumes:
  letta-code-data: {}
